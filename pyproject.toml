[tool.poetry]
name = "intelligent-order-assistant"
version = "0.1.0"
description = "AI-ready backend for intelligent e-commerce order management"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "*"
uvicorn = {extras = ["standard"], version = "*"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "*"
alembic = "*"
pydantic-settings = "*"
email-validator = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-asyncio = "^1.4"
httpx2 = "*"
ruff = "*"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]