[tool.poetry]
name = "intelligent-order-assistant"
version = "0.1.0"
description = "AI-ready backend for intelligent e-commerce order management"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "*"
uvicorn = {extras = ["standard"], version = "*"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "*"
alembic = "*"
pydantic-settings = "*"
email-validator = "^2.3.0"
pgvector = "^0.5.0"
openai = "^3.9.0"
langgraph = "^1.2.12"
langgraph-checkpoint-postgres = "^3.1.2"
psycopg = {extras = ["binary"], version = "^3.3.6"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-asyncio = "^1.4"
httpx2 = "*"
ruff = "*"
httpx = "^0.28.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]