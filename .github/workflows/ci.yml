name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: intelligent_order_assistant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intelligent_order_assistant_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/intelligent_order_assistant_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5434/intelligent_order_assistant_test
      OPENAI_API_KEY: test-only-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install poetry==2.4.1
      - run: poetry install --no-root
      - name: Prepare vector extension in testing
        run: poetry run python -m scripts.prepare_test_database
      - run: poetry run ruff check --no-cache .
      - run: poetry run ruff format --check --no-cache .
      - run: poetry run pytest -q
      - run: docker build -t intelligent-order-assistant:ci .
